<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTUITY — Essay Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f0f;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-y;
    }

    /* BACK BUTTON */
    .back-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #D4AF37;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 2000;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(-4px);
      border-color: #D4AF37;
    }

    /* NAVIGATION BAR */
    .navigation-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 20, 0.98);
      backdrop-filter: blur(40px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.05);
      z-index: 999;
      padding: 1rem 1.5rem 0;
    }

    .primary-tabs {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
      overflow-x: auto;
      padding-bottom: 0.75rem;
      scrollbar-width: none;
    }

    .primary-tabs::-webkit-scrollbar { display: none; }

    .primary-tab {
      padding: 0.875rem 1.75rem;
      background: transparent;
      border: none;
      border-bottom: 4px solid transparent;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .primary-tab:hover {
      color: #D4AF37;
      border-bottom-color: rgba(212, 175, 55, 0.4);
    }

    .primary-tab.active {
      color: #D4AF37;
      border-bottom-color: #D4AF37;
    }

    /* MODE TOGGLE */
    .secondary-controls {
      display: flex;
      justify-content: center;
      padding-bottom: 1rem;
    }

    .mode-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.25rem;
      gap: 0.25rem;
    }

    .mode-btn {
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: capitalize;
      font-family: 'Inter', sans-serif;
    }

    .mode-btn.active {
      background: rgba(212, 175, 55, 0.15);
      color: #D4AF37;
    }

    /* SLIDES CONTAINER */
    .slides-container {
      position: fixed;
      top: 140px;
      left: 0;
      right: 0;
      bottom: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* SLIDE CARD */
    .slide {
      position: relative;
      width: 100%;
      max-width: 1200px;
      max-height: 100%;
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 24px;
      padding: 2.5rem 2.5rem;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      display: none;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }

    .slide::-webkit-scrollbar {
      width: 6px;
    }

    .slide::-webkit-scrollbar-track {
      background: transparent;
    }

    .slide::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      display: flex;
      z-index: 1;
    }

    /* CARD HEADER */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 2px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .essay-type-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* TOGGLE SWITCH */
    .view-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      padding: 0.25rem;
      gap: 0.25rem;
    }

    .toggle-btn {
      padding: 0.4rem 0.875rem;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: rgba(0, 0, 0, 0.5);
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'Inter', sans-serif;
    }

    .toggle-btn:hover {
      color: rgba(0, 0, 0, 0.7);
    }

    .toggle-btn.active {
      background: #000000;
      color: #D4AF37;
    }

    /* SKELETON DISPLAY - COMPACT VERSION */
    .skeleton-display {
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      line-height: 1.3;
      color: #000000;
      text-align: left;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      white-space: pre-line;
      word-wrap: break-word;
    }

    .skeleton-display .paragraph-block {
      margin-bottom: 1rem;
      animation: fadeSlideIn 0.5s ease-out;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .skeleton-display .paragraph-block:last-child {
      margin-bottom: 0;
    }

    .skeleton-display .paragraph-title {
      font-size: 0.65rem;
      color: rgba(0, 0, 0, 0.5);
      margin-bottom: 0.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Color-coded paragraph titles */
    .skeleton-display .paragraph-block:nth-child(1) .paragraph-title {
      color: #2ecc71;
    }

    .skeleton-display .paragraph-block:nth-child(3) .paragraph-title,
    .skeleton-display .paragraph-block:nth-child(5) .paragraph-title,
    .skeleton-display .paragraph-block:nth-child(7) .paragraph-title {
      color: #e67e22;
    }

    .skeleton-display .paragraph-block:last-child .paragraph-title {
      color: #3498db;
    }

    .skeleton-display .paragraph-text {
      font-size: 1.1rem;
      color: #000000;
      line-height: 1.3;
      margin-bottom: 0.4rem;
    }

    .skeleton-display .paragraph-text:last-child {
      margin-bottom: 0;
    }

    /* PHRASES DISPLAY */
    .phrases-display {
      font-family: 'Inter', sans-serif;
      color: #000000;
    }

    .phrase-category {
      margin-bottom: 2.5rem;
      animation: fadeSlideIn 0.5s ease-out;
    }

    .phrase-category:last-child {
      margin-bottom: 0;
    }

    .category-title {
      font-size: 1rem;
      font-weight: 800;
      color: #000000;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid rgba(0, 0, 0, 0.2);
    }

    .subcategory {
      margin-bottom: 1.5rem;
    }

    .subcategory:last-child {
      margin-bottom: 0;
    }

    .subcategory-title {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #e67e22;
      margin-bottom: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .phrase-list {
      list-style: none;
      padding: 0;
    }

    .phrase-item {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #2c3e50;
      margin-bottom: 0.5rem;
      padding-left: 1.25rem;
      position: relative;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }

    .phrase-item:before {
      content: "→";
      position: absolute;
      left: 0;
      color: #3498db;
      font-weight: 700;
    }

    /* NAVIGATION ARROWS */
    .nav-arrows {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.75rem;
      z-index: 1000;
    }

    .nav-arrow {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.1);
      border: 2px solid rgba(212, 175, 55, 0.3);
      color: #D4AF37;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .nav-arrow:active {
      transform: scale(0.95);
    }

    .nav-arrow:disabled {
      opacity: 0.15;
      cursor: not-allowed;
    }

    /* PROGRESS DOTS */
    .progress-dots {
      position: fixed;
      bottom: 4.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 1000;
    }

    .progress-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s;
      cursor: pointer;
    }

    .progress-dot.active {
      background: #D4AF37;
      border-color: #D4AF37;
      transform: scale(1.25);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    /* MOBILE HEADER */
    .slide-header {
      display: none;
    }

    /* ============================================ */
    /* MOBILE OPTIMIZATIONS */
    /* ============================================ */
    @media (max-width: 768px) {
      html, body {
        width: 100vw;
        height: 100vh;
        height: -webkit-fill-available;
        overflow: hidden;
        position: fixed;
      }

      /* Hide desktop nav */
      .navigation-bar {
        display: none;
      }

      /* Back button - compact */
      .back-btn {
        top: 0.75rem;
        left: 0.75rem;
        padding: 0.5rem 0.85rem;
        font-size: 0.75rem;
        z-index: 5000;
        gap: 0.3rem;
      }

      /* Full screen container */
      .slides-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        height: -webkit-fill-available;
        padding: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Slide - 10% breathing space */
      .slide {
        position: fixed;
        top: 5vh;
        left: 5vw;
        width: 90vw;
        height: 90vh;
        max-width: 90vw;
        border: none;
        border-radius: 20px;
        padding: 0;
        margin: 0;
        gap: 0;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        display: none;
        flex-direction: column;
        overflow: hidden;
      }

      .slide.active {
        display: flex !important;
      }

      /* Mobile header - three-column layout */
      .slide-header {
        display: flex !important;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        border-bottom: 2px solid rgba(0, 0, 0, 0.08);
        padding: 0.75rem;
        gap: 0.5rem;
        flex-shrink: 0;
        width: 100%;
        position: relative;
      }

      /* Categories menu section - left */
      .category-menu-section {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      .category-label {
        font-size: 0.65rem;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.5);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* iOS-style menu button */
      .category-menu-btn {
        width: 36px;
        height: 36px;
        background: #000000;
        border: none;
        border-radius: 50%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 3px;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
      }

      .category-menu-btn:active {
        transform: scale(0.95);
        background: #1a1a1a;
      }

      .menu-dot {
        width: 4px;
        height: 4px;
        background: #ffffff;
        border-radius: 50%;
      }

      /* Center spacer */
      .header-spacer {
        flex: 1;
      }

      /* Dropdown menu */
      .category-dropdown {
        position: absolute;
        top: calc(100% + 0.5rem);
        left: 0.75rem;
        transform: translateY(-10px);
        background: rgba(245, 245, 245, 0.98);
        backdrop-filter: blur(20px);
        border-radius: 12px;
        padding: 0.5rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 100;
        min-width: 200px;
        border: 1px solid rgba(0, 0, 0, 0.06);
      }

      .category-dropdown.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .category-dropdown-item {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.6rem 1rem;
        background: transparent;
        border: none;
        border-radius: 8px;
        width: 100%;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        margin-bottom: 0.15rem;
      }

      .category-dropdown-item:last-child {
        margin-bottom: 0;
      }

      .category-dropdown-item:active {
        transform: scale(0.97);
      }

      .category-dropdown-item.active {
        background: rgba(0, 0, 0, 0.08);
      }

      .category-dropdown-item:not(.active):hover {
        background: rgba(0, 0, 0, 0.04);
      }

      .category-dropdown-title {
        font-size: 0.7rem;
        font-weight: 700;
        color: #000000;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }

      /* Mode toggle - right side */
      .slide-mode-toggle {
        display: flex !important;
        flex-shrink: 0;
      }

      .mobile-mode-toggle {
        display: flex !important;
        background: rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 10px;
        padding: 0.15rem;
        gap: 0.15rem;
      }

      .mobile-mode-toggle .mode-btn {
        padding: 0.3rem 0.7rem;
        font-size: 0.55rem;
        border-radius: 8px;
        background: transparent;
        border: none;
        color: rgba(0, 0, 0, 0.4);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        transition: all 0.2s;
      }

      .mobile-mode-toggle .mode-btn.active {
        background: #000000;
        color: #D4AF37;
      }

      /* Card header - hide on mobile (replaced by slide-header) */
      .card-header {
        display: none !important;
      }

      /* Content area - scrollable */
      .skeleton-display,
      .phrases-display {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 1.25rem;
      }

      /* Skeleton - compact mobile */
      .skeleton-display {
        font-size: 0.8rem;
        line-height: 1.25;
      }

      .skeleton-display .paragraph-title {
        font-size: 0.5rem;
        margin-bottom: 0.3rem;
        gap: 0.25rem;
      }

      .skeleton-display .paragraph-text {
        font-size: 0.8rem;
        margin-bottom: 0.3rem;
      }

      .skeleton-display .paragraph-block {
        margin-bottom: 0.75rem;
      }

      /* Phrases display mobile */
      .phrase-category {
        margin-bottom: 1.5rem;
      }

      .category-title {
        font-size: 0.8125rem;
        margin-bottom: 0.75rem;
      }

      .subcategory {
        margin-bottom: 1rem;
      }

      .subcategory-title {
        font-size: 0.6875rem;
        margin-bottom: 0.5rem;
      }

      .phrase-item {
        font-size: 0.8125rem;
        margin-bottom: 0.375rem;
        padding-left: 1rem;
      }

      /* Navigation */
      .nav-arrows {
        bottom: 1rem;
        gap: 0.6rem;
      }

      .nav-arrow {
        width: 48px;
        height: 48px;
        font-size: 1.2rem;
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .progress-dots {
        bottom: 3.5rem;
        gap: 0.4rem;
      }

      .progress-dot {
        width: 6px;
        height: 6px;
      }
    }

    /* Extra small phones */
    @media (max-width: 375px) {
      .skeleton-display {
        font-size: 0.7rem;
        padding: 1rem;
        line-height: 1.2;
      }

      .skeleton-display .paragraph-text {
        font-size: 0.7rem;
      }

      .skeleton-display .paragraph-title {
        font-size: 0.45rem;
      }

      .phrase-item {
        font-size: 0.75rem;
      }

      .category-title {
        font-size: 0.75rem;
      }

      .subcategory-title {
        font-size: 0.625rem;
      }
    }

    /* Desktop - hide mobile elements */
    @media (min-width: 769px) {
      .mobile-mode-toggle,
      .slide-header {
        display: none !important;
      }
    }
  </style>
</head>
<body>

<button class="back-btn" onclick="alert('Back navigation would go here')">
  <span>←</span>
  <span>Back</span>
</button>

<!-- DESKTOP NAVIGATION -->
<nav class="navigation-bar">
  <div class="primary-tabs" id="primaryTabs"></div>
  
  <div class="secondary-controls">
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="skeleton" onclick="setViewMode('skeleton')">Skeleton</button>
      <button class="mode-btn" data-mode="phrases" onclick="setViewMode('phrases')">Phrases</button>
    </div>
  </div>
</nav>

<!-- SLIDES CONTAINER -->
<div class="slides-container" id="slidesContainer"></div>

<!-- NAVIGATION -->
<div class="nav-arrows">
  <button class="nav-arrow" onclick="navigate(-1)">←</button>
  <button class="nav-arrow" onclick="navigate(1)">→</button>
</div>

<div class="progress-dots" id="progressDots"></div>

<script>
// ==================== STATE ====================
let skeletonData = null;
let phraseData = null;
let currentType = 'for-against';
let currentVariation = 0;
let viewMode = 'skeleton';

// ==================== INIT ====================
async function init() {
  try {
    console.log('🚀 Starting init...');
    
    // Load skeleton data
    const skeletonResponse = await fetch('data/complete-essay-phrase-bank1.json');
    
    if (!skeletonResponse.ok) {
      throw new Error(`Skeleton fetch failed: ${skeletonResponse.status}`);
    }
    
    skeletonData = await skeletonResponse.json();
    console.log('✅ Skeleton data loaded');
    console.log('📊 Skeleton data structure:', skeletonData);
    console.log('📊 for-against exists?', !!skeletonData['for-against']);
    console.log('📊 for-against data:', skeletonData['for-against']);
    console.log('📊 for-against skeletons?', skeletonData['for-against']?.skeletons);
    console.log('📊 for-against skeletons length?', skeletonData['for-against']?.skeletons?.length);
    
    // Load phrase data
    const phraseResponse = await fetch('data/complete-essay-phrase-bank.json');
    
    if (!phraseResponse.ok) {
      throw new Error(`Phrase fetch failed: ${phraseResponse.status}`);
    }
    
    phraseData = await phraseResponse.json();
    console.log('✅ Phrase data loaded');
    
    // Render
    renderPrimaryTabs();
    renderContent();
    renderDots();
    updateNav();
    
    console.log('✅ Init complete');
    
  } catch (error) {
    console.error('❌ Init error:', error);
    document.getElementById('slidesContainer').innerHTML = `
      <div style="text-align: center; padding: 2rem; color: #D4AF37;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
        <div style="font-size: 1.5rem; font-weight: 700;">Failed to load</div>
        <div style="font-size: 1rem; margin-top: 1rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 8px;">
          ${error.message}
        </div>
        <div style="font-size: 0.875rem; margin-top: 1rem; opacity: 0.6;">
          Check browser console (F12) for details
        </div>
      </div>
    `;
  }
}

// ==================== RENDER PRIMARY TABS ====================
function renderPrimaryTabs() {
  const container = document.getElementById('primaryTabs');
  
  if (!skeletonData) {
    console.error('❌ Cannot render tabs: skeletonData is null');
    return;
  }
  
  const types = Object.keys(skeletonData).filter(key => key !== 'meta');
  console.log('📋 Available types:', types);
  
  container.innerHTML = types.map(typeKey => {
    const typeData = skeletonData[typeKey];
    return `
      <button class="primary-tab ${typeKey === currentType ? 'active' : ''}" 
              onclick="switchType('${typeKey}')">
        ${typeData.label}
      </button>
    `;
  }).join('');
}

// ==================== SWITCH TYPE ====================
function switchType(type) {
  console.log('🔄 Switching to type:', type);
  currentType = type;
  currentVariation = 0;
  renderPrimaryTabs();
  renderContent();
  renderDots();
  updateNav();
}

// ==================== RENDER CONTENT ====================
function renderContent() {
  console.log('🎨 renderContent called');
  console.log('   currentType:', currentType);
  console.log('   currentVariation:', currentVariation);
  console.log('   viewMode:', viewMode);
  
  const container = document.getElementById('slidesContainer');
  container.innerHTML = '';
  
  if (!skeletonData) {
    console.error('❌ skeletonData is null');
    container.innerHTML = '<div style="color: #D4AF37; padding: 2rem; text-align: center;">Skeleton data not loaded</div>';
    return;
  }
  
  console.log('✅ skeletonData exists');
  console.log('📊 skeletonData keys:', Object.keys(skeletonData));
  
  if (!skeletonData[currentType]) {
    console.error('❌ Current type not found:', currentType);
    console.log('   Available types:', Object.keys(skeletonData).filter(k => k !== 'meta'));
    container.innerHTML = `<div style="color: #D4AF37; padding: 2rem; text-align: center;">Essay type "${currentType}" not found</div>`;
    return;
  }
  
  const typeData = skeletonData[currentType];
  console.log('✅ typeData found:', typeData);
  console.log('📊 typeData.skeletons:', typeData.skeletons);
  console.log('📊 typeData.skeletons type:', typeof typeData.skeletons);
  console.log('📊 typeData.skeletons is array?:', Array.isArray(typeData.skeletons));
  
  if (!typeData.skeletons) {
    console.error('❌ typeData.skeletons is null/undefined');
    container.innerHTML = `<div style="color: #D4AF37; padding: 2rem; text-align: center;">No skeletons array found</div>`;
    return;
  }
  
  console.log('📊 typeData.skeletons.length:', typeData.skeletons.length);
  
  if (!Array.isArray(typeData.skeletons) || typeData.skeletons.length === 0) {
    console.error('❌ Skeletons array is empty or not an array');
    container.innerHTML = `<div style="color: #D4AF37; padding: 2rem; text-align: center;">Skeletons array is empty</div>`;
    return;
  }
  
  if (!typeData.skeletons[currentVariation]) {
    console.error('❌ Variation not found at index:', currentVariation);
    console.log('   Available variations:', typeData.skeletons.length);
    container.innerHTML = `<div style="color: #D4AF37; padding: 2rem; text-align: center;">Variation ${currentVariation} not found (have ${typeData.skeletons.length} variations)</div>`;
    return;
  }
  
  const variation = typeData.skeletons[currentVariation];
  console.log('✅ Variation found:', variation);
  
  const slide = document.createElement('div');
  slide.className = 'slide active';
  
  // Build header with toggle
  const headerHTML = `
    <div class="card-header">
      <div class="essay-type-title">${typeData.label}${viewMode === 'skeleton' ? ` — ${variation.name}` : ''}</div>
      <div class="view-toggle">
        <button class="toggle-btn ${viewMode === 'skeleton' ? 'active' : ''}" onclick="setViewMode('skeleton')">
          Skeleton
        </button>
        <button class="toggle-btn ${viewMode === 'phrases' ? 'active' : ''}" onclick="setViewMode('phrases')">
          Phrases
        </button>
      </div>
    </div>
  `;
  
  // Build mobile header
  const types = Object.keys(skeletonData).filter(key => key !== 'meta');
  const dropdownHTML = types.map(typeKey => {
    const td = skeletonData[typeKey];
    return `
      <button class="category-dropdown-item ${typeKey === currentType ? 'active' : ''}" 
              onclick="selectCategoryFromDropdown('${typeKey}', event)">
        <div class="category-dropdown-title">${td.label}</div>
      </button>
    `;
  }).join('');
  
  const mobileHeaderHTML = `
    <div class="slide-header">
      <div class="category-menu-section">
        <span class="category-label">Essay Type</span>
        <button class="category-menu-btn" onclick="toggleCategoryDropdown(event)">
          <span class="menu-dot"></span>
          <span class="menu-dot"></span>
          <span class="menu-dot"></span>
        </button>
      </div>
      <div class="category-dropdown" id="categoryDropdown">
        ${dropdownHTML}
      </div>
      <div class="header-spacer"></div>
      <div class="slide-mode-toggle">
        <div class="mobile-mode-toggle">
          <button class="mode-btn ${viewMode === 'skeleton' ? 'active' : ''}" data-mode="skeleton" onclick="setViewMode('skeleton')">Skeleton</button>
          <button class="mode-btn ${viewMode === 'phrases' ? 'active' : ''}" data-mode="phrases" onclick="setViewMode('phrases')">Phrases</button>
        </div>
      </div>
    </div>
  `;
  
  let contentHTML = '';
  
  try {
    if (viewMode === 'skeleton') {
      console.log('🖼️ Rendering skeleton...');
      contentHTML = renderSkeleton(variation);
    } else {
      console.log('🖼️ Rendering phrases...');
      contentHTML = renderPhrases(currentType);
    }
  } catch (error) {
    console.error('❌ Error rendering content:', error);
    contentHTML = `<div style="color: red; padding: 2rem;">Error: ${error.message}</div>`;
  }
  
  slide.innerHTML = mobileHeaderHTML + headerHTML + contentHTML;
  container.appendChild(slide);
  console.log('✅ Content rendered successfully');
}

// ==================== RENDER SKELETON ====================
function renderSkeleton(variation) {
  console.log('🖼️ renderSkeleton called with:', variation);
  
  if (!variation) {
    console.error('❌ variation is null/undefined');
    return '<div style="padding: 2rem; color: red;">No variation provided</div>';
  }
  
  if (!variation.skeleton) {
    console.error('❌ variation.skeleton is null/undefined');
    return '<div style="padding: 2rem; color: red;">No skeleton property in variation</div>';
  }
  
  let html = '<div class="skeleton-display">';
  
  variation.skeleton.forEach((para, index) => {
    html += '<div class="paragraph-block">';
    html += `<div class="paragraph-title">${para.emoji || '📝'} ${para.title || 'Untitled'}</div>`;
    
    if (para.lines && Array.isArray(para.lines)) {
      para.lines.forEach(line => {
        if (line !== "") {
          html += `<div class="paragraph-text">${line}</div>`;
        }
      });
    }
    
    html += '</div>';
  });
  
  html += '</div>';
  return html;
}

// ==================== RENDER PHRASES ====================
function renderPhrases(essayType) {
  if (!phraseData || !phraseData[essayType] || !phraseData[essayType].categories) {
    return '<div class="phrases-display" style="padding: 2rem; text-align: center; color: rgba(0,0,0,0.4);">No phrase bank available for this essay type.</div>';
  }
  
  const categories = phraseData[essayType].categories;
  
  let html = '<div class="phrases-display">';
  
  categories.forEach(category => {
    html += '<div class="phrase-category">';
    html += `<div class="category-title">${category.title || 'Untitled'}</div>`;
    
    if (category.subcategories) {
      category.subcategories.forEach(sub => {
        html += '<div class="subcategory">';
        html += `<div class="subcategory-title">${sub.subtitle || ''}</div>`;
        html += '<ul class="phrase-list">';
        
        if (sub.phrases) {
          sub.phrases.forEach(phrase => {
            html += `<li class="phrase-item">${phrase}</li>`;
          });
        }
        
        html += '</ul></div>';
      });
    }
    
    html += '</div>';
  });
  
  html += '</div>';
  return html;
}

// ==================== SET VIEW MODE ====================
function setViewMode(mode) {
  viewMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  renderContent();
  renderDots();
  updateNav();
}

// ==================== RENDER DOTS ====================
function renderDots() {
  const container = document.getElementById('progressDots');
  container.innerHTML = '';
  
  if (viewMode === 'skeleton' && skeletonData && skeletonData[currentType]) {
    const typeData = skeletonData[currentType];
    if (typeData.skeletons && Array.isArray(typeData.skeletons)) {
      typeData.skeletons.forEach((skeleton, index) => {
        const dot = document.createElement('div');
        dot.className = `progress-dot ${index === currentVariation ? 'active' : ''}`;
        dot.onclick = () => switchVariation(index);
        container.appendChild(dot);
      });
    }
  }
}

// ==================== SWITCH VARIATION ====================
function switchVariation(index) {
  currentVariation = index;
  renderContent();
  renderDots();
  updateNav();
}

// ==================== NAVIGATE ====================
function navigate(direction) {
  if (viewMode === 'skeleton') {
    if (!skeletonData || !skeletonData[currentType]) return;
    const typeData = skeletonData[currentType];
    currentVariation += direction;
    currentVariation = Math.max(0, Math.min(currentVariation, typeData.skeletons.length - 1));
    renderDots();
  } else {
    const types = Object.keys(skeletonData).filter(key => key !== 'meta');
    const currentIndex = types.indexOf(currentType);
    const newIndex = currentIndex + direction;
    if (newIndex >= 0 && newIndex < types.length) {
      switchType(types[newIndex]);
      return;
    }
  }
  renderContent();
  updateNav();
}

// ==================== UPDATE NAV ====================
function updateNav() {
  const arrows = document.querySelectorAll('.nav-arrow');
  
  if (!skeletonData || !skeletonData[currentType]) {
    arrows[0].disabled = true;
    arrows[1].disabled = true;
    return;
  }
  
  if (viewMode === 'skeleton') {
    const typeData = skeletonData[currentType];
    arrows[0].disabled = currentVariation === 0;
    arrows[1].disabled = currentVariation === typeData.skeletons.length - 1;
  } else {
    const types = Object.keys(skeletonData).filter(key => key !== 'meta');
    const currentIndex = types.indexOf(currentType);
    arrows[0].disabled = currentIndex === 0;
    arrows[1].disabled = currentIndex === types.length - 1;
  }
}

// ==================== CATEGORY DROPDOWN ====================
function toggleCategoryDropdown(event) {
  if (event) event.stopPropagation();
  const dropdown = document.getElementById('categoryDropdown');
  if (dropdown) dropdown.classList.toggle('show');
}

function selectCategoryFromDropdown(categoryId, event) {
  if (event) event.stopPropagation();
  const dropdown = document.getElementById('categoryDropdown');
  if (dropdown) dropdown.classList.remove('show');
  switchType(categoryId);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.category-menu-btn') && !e.target.closest('.category-dropdown')) {
    const dropdown = document.getElementById('categoryDropdown');
    if (dropdown) dropdown.classList.remove('show');
  }
});

// ==================== KEYBOARD NAV ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

document.body.addEventListener('touchmove', function(e) {
  if (e.target === document.body) e.preventDefault();
}, { passive: false });

// ==================== START ====================
init();
</script>
</body>
</html>
